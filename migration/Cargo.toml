[package]
name = "gta-muguet-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "GPL-3.0-or-later"
publish = false

[features]
default = []
compiler = ["wasmtime/cranelift", "wasmtime/parallel-compilation", "wasmtime/wat", "wasmtime/all-arch"]
embedded-check = []

[dependencies]
wasmtime = { version = "=49.0.2", default-features = false, features = ["runtime", "threads", "anyhow", "std"] }
anyhow = "=1.0.104"
sha2 = "=0.10.9"
serde_json = "=1.0.151"
libc = "=0.2.190"

[[bin]]
name = "migration-probe"
path = "src/bin/probe.rs"
required-features = ["compiler"]

[[bin]]
name = "embedded-aot-check"
path = "src/bin/embedded.rs"
required-features = ["embedded-check"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

