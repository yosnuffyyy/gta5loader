name: Native iPhone prototype
on:
  push:
    branches: [native-ios-prototype]
    paths: ['native-ios/**', '.github/workflows/native-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            native-build/object-cache
            native-build/rust-target
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: native-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Test, compile and package native engine prototype
        run: bash native-ios/ci-convert.sh
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always() && !cancelled()
        with:
          path: |
            native-build/object-cache
            native-build/rust-target
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-compiler-evidence
          path: native-build/evidence/
          retention-days: 14
      - name: Upload unsigned iPhone app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GTA-Native-Probe-unsigned
          path: native-build/GTA-Native-Probe-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
